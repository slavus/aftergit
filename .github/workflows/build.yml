name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and headless tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # the default target platform releng/aftergit-p2.target, resolved from download.eclipse.org
      - name: Build
        run: mvn -B -ntp verify
      - name: Upload the update site
        uses: actions/upload-artifact@v4.6.2
        with:
          name: aftergit-site
          path: releng/net.aftergit.merge.site/target/repository
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/work/data/.metadata/.log
          if-no-files-found: ignore

  ui-tests:
    name: UI tests (Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Xvfb and GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64
      # releng/ui-tests.sh starts its own Xvfb display, unsets WAYLAND_DISPLAY and builds with -Pui-tests
      - name: UI tests
        env:
          AFTERGIT_XVFB_DISPLAY: '99'
        run: releng/ui-tests.sh -ntp
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ui-screenshots
          path: bundles/net.aftergit.merge.ui.tests/target/screenshots
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ui-test-reports
          path: |
            **/target/surefire-reports
            **/target/work/data/.metadata/.log
          if-no-files-found: ignore
