command.nextChange.description=Go to the next change in the focused pane.
command.prevChange.description=Go to the previous change in the focused pane.
command.nextConflict.description=Go to the next conflict that is still open.
command.prevConflict.description=Go to the previous conflict that is still open.
command.nextAnyConflict.description=Go to the next conflict, resolved or not.
command.prevAnyConflict.description=Go to the previous conflict, resolved or not.
command.nextError.description=Go to the next compile error in the result.
command.prevError.description=Go to the previous compile error in the result.
command.nextAutoResolved.description=Go to the next block AfterGit resolved on its own.
command.prevAutoResolved.description=Go to the previous block AfterGit resolved on its own.
command.takeLeft.description=Resolve the current block with the left side (ours).
command.takeRight.description=Resolve the current block with the right side (theirs).
command.takeBoth.name=Take Both
command.takeBoth.description=Resolve the current block with both sides, left first.
command.ignore.name=Ignore
command.ignore.description=Keep the current change out of the result.
command.revert.name=Revert Block
command.revert.description=Put the current block back to its state when the file was opened.
command.markReviewed.name=Mark Reviewed
command.markReviewed.description=Mark the current automatic or AI resolution as reviewed.
command.showProposal.name=Show Waiting Proposal
command.showProposal.description=Show the AI proposal that waits for the current block.
command.aiResolveConflict.name=Resolve Conflict with AI
command.aiResolveConflict.description=Ask the AI resolver for the current open conflict.
command.aiResolveAll.name=Resolve All with AI
command.aiResolveAll.description=Ask the AI resolver for every open conflict of the file.
command.saveAndMarkResolved.name=Save and Mark Resolved
command.saveAndMarkResolved.description=Save the result and stage it (git add); the resolver closes unless that is switched off in Preferences > AfterGit.
command.compareOursBase.name=Compare Ours with Base
command.compareOursBase.description=Open a compare of the left side with the common base.
command.compareTheirsBase.name=Compare Theirs with Base
command.compareTheirsBase.description=Open a compare of the right side with the common base.
command.compareOursTheirs.name=Compare Ours with Theirs
command.compareOursTheirs.description=Open a compare of the two sides.
command.layoutAll.name=Layout: Ours | Result | Theirs
command.layoutAll.description=Show the left side, the result and the right side next to each other.
command.layoutLeftResult.name=Layout: Left + Result
