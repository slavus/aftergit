colors.category.description=Colours and the font of the AfterGit merge resolver. Light and dark themes have their own values; Preferences > AfterGit > Appearance offers colour schemes.
colors.changes=Changes
colors.changes.description=Changes one side made that are not in conflict.
colors.states=Conflicts and states
colors.states.description=Open conflicts and how resolved blocks got their result.
colors.current=Current block
colors.current.description=The block under the caret.
colors.ai=AI
colors.ai.description=Blocks resolved by an AI resolver or an agent.
font.panes=AfterGit merge panes
font.panes.description=The font of the three panes, their line numbers and the code in the Structure panel. By default the Text Font.
color.added.strong.description=Changed words of an added line, and the band of an added block in the connectors and overview stripes.
color.added.light.description=Background of lines one side added.
color.removed.strong.description=Changed words of a removed line, and the band of a removed block in the connectors and overview stripes.
color.removed.light.description=Background of lines one side removed.
color.modified.strong.description=Changed words of a modified line and of a taken side or result that differ from the other texts of a resolved conflict; the band of a taken side in the connectors.
color.modified.light.description=Background of lines one side modified and of a resolved conflict's result.
color.conflict.strong.description=Changed words inside an open conflict and the outline of its connector band.
color.conflict.light.description=Background of an open conflict in all three panes and its connector.
color.auto.strong.description=Bar, review frame and "A" badge of a block AfterGit resolved on its own, and the thin mark where one of its texts lacks words of another; mixed with auto.light for its words that differ.
color.auto.light.description=Background of a block AfterGit resolved on its own, in all three panes and the connectors; mixed with auto.strong for its words that differ.
color.auto.hatch.description=Stripes over an automatic resolution that still needs review.
color.dropped.light.description=Background of a side whose text is not in the result; mixed with dropped.text for its words that differ from the result.
color.dropped.text.description=Struck-through text and dashed outline of a side whose text is not in the result, and the thin mark where it lacks words of the result; mixed with dropped.light for the background and text of its words that differ.
color.edited.strong.description=Bar in the result's ruler of a conflict the user edited by hand.
color.taken.strong.description=Bar in the result's ruler of a conflict resolved by taking a side, and the thin mark where a taken side or the result lacks words of another text.
color.current.description=Frame and bar of the block under the caret in every pane, along the connectors and on the overview stripes.
color.ai.strong.description=Border of an AI-resolved block and its connector band, and the thin mark where its result lacks words of a side; mixed with ai.light for the result's words that differ.
color.ai.light.description=Background of an AI-resolved block; mixed with ai.strong for the result's words that differ from a side.
